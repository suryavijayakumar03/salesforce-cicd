name: Validate Production

on:
  pull_request:
    branches:
      - main

jobs:
  validate-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to Production
        env:
          SALESFORCE_PROD_AUTH_URL: ${{ secrets.SALESFORCE_PROD_AUTH_URL }}
        run: |
          printf "%s" "$SALESFORCE_PROD_AUTH_URL" > ./prod-auth-url.txt
          sf org login sfdx-url --sfdx-url-file ./prod-auth-url.txt --alias prod

      - name: Validate deployment against Production
        run: |
          sf project deploy validate \
            --target-org prod \
            --source-dir force-app \
            --test-level RunLocalTests \
            --wait 120

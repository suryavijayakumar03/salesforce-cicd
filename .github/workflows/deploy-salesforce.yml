name: Deploy Salesforce

on:
  push:
    branches:
      - dev
      - qat
      - preprod
      - main
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to deploy
        required: true
        default: main
        type: choice
        options:
          - dev
          - qat
          - preprod
          - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.target_branch) || github.ref_name) == 'main' && 'production' || ((github.event_name == 'workflow_dispatch' && github.event.inputs.target_branch) || github.ref_name) }}
    env:
      TARGET_BRANCH: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.target_branch) || github.ref_name }}
      SALESFORCE_DEV_AUTH_URL: ${{ secrets.SALESFORCE_DEV_AUTH_URL }}
      SALESFORCE_QAT_AUTH_URL: ${{ secrets.SALESFORCE_QAT_AUTH_URL }}
      SALESFORCE_PREPROD_AUTH_URL: ${{ secrets.SALESFORCE_PREPROD_AUTH_URL }}
      SALESFORCE_PROD_AUTH_URL: ${{ secrets.SALESFORCE_PROD_AUTH_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Detect Salesforce metadata changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_metadata_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          echo "$CHANGED_FILES"
          if echo "$CHANGED_FILES" | grep -E '^(force-app/|manifest/|sfdx-project\.json|package\.xml|\.forceignore)' >/dev/null; then
            echo "has_metadata_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_metadata_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve target org
        id: target
        if: steps.changes.outputs.has_metadata_changes == 'true'
        run: |
          case "$TARGET_BRANCH" in
            dev)
              echo "environment_name=dev" >> "$GITHUB_OUTPUT"
              echo "org_alias=dev" >> "$GITHUB_OUTPUT"
              printf "%s" "$SALESFORCE_DEV_AUTH_URL" > ./auth-url.txt
              ;;
            qat)
              echo "environment_name=qat" >> "$GITHUB_OUTPUT"
              echo "org_alias=qat" >> "$GITHUB_OUTPUT"
              printf "%s" "$SALESFORCE_QAT_AUTH_URL" > ./auth-url.txt
              ;;
            preprod)
              echo "environment_name=preprod" >> "$GITHUB_OUTPUT"
              echo "org_alias=preprod" >> "$GITHUB_OUTPUT"
              printf "%s" "$SALESFORCE_PREPROD_AUTH_URL" > ./auth-url.txt
              ;;
            main)
              echo "environment_name=production" >> "$GITHUB_OUTPUT"
              echo "org_alias=prod" >> "$GITHUB_OUTPUT"
              printf "%s" "$SALESFORCE_PROD_AUTH_URL" > ./auth-url.txt
              ;;
            *)
              echo "Unsupported target branch: $TARGET_BRANCH"
              exit 1
              ;;
          esac

      - name: Skip deployment when no Salesforce metadata changed
        if: steps.changes.outputs.has_metadata_changes == 'false'
        run: echo "No Salesforce metadata changes detected in this push. Skipping deployment."

      - name: Install Salesforce CLI
        if: steps.changes.outputs.has_metadata_changes == 'true'
        run: npm install --global @salesforce/cli

      - name: Authenticate to target org
        if: steps.changes.outputs.has_metadata_changes == 'true'
        run: |
          sf org login sfdx-url --sfdx-url-file ./auth-url.txt --alias "${{ steps.target.outputs.org_alias }}"

      - name: Deploy to target org
        if: steps.changes.outputs.has_metadata_changes == 'true'
        run: |
          sf project deploy start \
            --target-org "${{ steps.target.outputs.org_alias }}" \
            --source-dir force-app \
            --test-level RunLocalTests \
            --wait 120

      - name: Resolve promotion target
        id: promote
        if: steps.changes.outputs.has_metadata_changes == 'true'
        run: |
          case "$TARGET_BRANCH" in
            dev)
              echo "next_branch=qat" >> "$GITHUB_OUTPUT"
              ;;
            qat)
              echo "next_branch=preprod" >> "$GITHUB_OUTPUT"
              ;;
            preprod)
              echo "next_branch=main" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "next_branch=" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported target branch for promotion: $TARGET_BRANCH"
              exit 1
              ;;
          esac

      - name: Promote branch forward
        if: steps.changes.outputs.has_metadata_changes == 'true' && steps.promote.outputs.next_branch != ''
        env:
          NEXT_BRANCH: ${{ steps.promote.outputs.next_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$NEXT_BRANCH"
          git checkout "$NEXT_BRANCH"
          git merge "origin/$TARGET_BRANCH" --no-edit
          git push origin "HEAD:$NEXT_BRANCH"
